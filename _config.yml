name: Boyi Fu
title: Boyi Fu
description: Boyi Fu is an M.Phil. student in Artificial Intelligence at HKUST(GZ), with research interests in spatial intelligence, 3D reconstruction, the embodied world, and AI4AI.
url: https://boyifu-ai.github.io
baseurl: ""
lang: en
permalink: /:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-sitemap
  - jekyll-feed
exclude:
  - README.md
  - DESIGN-NOTES.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - tools
  - preview.ps1
  - preview.cmd
  - preview.log
  - preview-error.log
  - visitor-telemetry-worker
  - qa
  - vendor
  - .bundle
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav: news
      math: true
analytics_id: G-YE7VVPT8CQ
visitor_map:
  api_url: https://boyifu-visitor-map.boyifu101.workers.dev
  fallback_api_url: ""
  baseline_visits: 1000000
